<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Persiapan Barang Kiriman</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a2f;--mute:#5d6b70;--bg:#e9ece8;--panel:#f8f9f7;--line:#cfd5d0;--accent:#0f5c5a;--warn:#fff3d6}
*{box-sizing:border-box}
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:360px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;height:100vh;position:sticky;top:0;overflow:auto}
h1{font-size:17px;margin:0}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg label{margin:0;cursor:pointer;text-align:center}.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:8px;font-weight:600;font-size:13px}.seg input:checked+span{background:var(--accent);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-3px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--mute);margin:0}
.banner{background:var(--warn);border:1px solid #e6cf8f;border-radius:6px;padding:9px 10px;font-size:12.5px}
.banner button{margin-top:6px}
.dos{border:1px solid var(--line);border-radius:6px;background:#fff;max-height:42vh;overflow:auto}
.do{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid #edf0ed;cursor:pointer}
.do:last-child{border:0}.do:hover{background:#f3f6f3}
.do input{margin-top:3px;accent-color:var(--accent)}
.do b{font-size:13px;display:block}.do span{font-size:12px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center}
button{font:inherit;border-radius:6px;border:1px solid var(--line);background:#fff;padding:6px 10px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding:11px;width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;text-decoration:underline}
.empty{padding:16px;font-size:13px;color:var(--mute)}
main{padding:24px;overflow:auto}
.sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto 20px;padding:10mm;box-shadow:0 2px 14px rgba(0,0,0,.15);color:#000;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
.sheet h2{text-align:center;font-size:14pt;margin:2mm 0 4mm;letter-spacing:.2px}
.head{display:flex;justify-content:space-between;font-size:8pt;margin-bottom:3mm}
.brand{font-family:'Public Sans',serif;font-weight:600;font-size:13pt;letter-spacing:.5px}
.addr{margin-top:2mm;line-height:1.35;max-width:85mm}
.meta{font-size:9pt;width:75mm}
.meta div{display:flex;margin-bottom:1.2mm}.meta b{width:20mm;flex:none}
.meta span{flex:1;border-bottom:1px solid #000;min-height:4.2mm;padding-left:1mm;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
th{background:#2b2b2b;color:#fff;font-weight:600;font-size:7.5pt;padding:1mm;border:1px solid #2b2b2b}
td{border:1px solid #000;height:4.9mm;padding:0 1.2mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.n{text-align:center;font-size:7.5pt}td.q{text-align:center;font-weight:700}td.i{white-space:normal;line-height:1.2;padding:.5mm 1.2mm;overflow:visible}td.d{font-size:7pt;text-align:center;padding:0 .5mm}
td small{color:#555;font-size:6.5pt;margin-left:2mm}
.foot{margin-top:auto;display:flex;gap:6mm;padding-top:4mm;font-size:8.5pt}
.pallet{width:90mm;height:28mm;border:1px solid #000;padding:1.5mm;font-weight:700}
.sign{flex:1;display:flex;justify-content:space-between;align-items:flex-end;font-weight:700}
.sign div{text-align:center}.sign i{display:block;height:17mm;width:38mm;border-bottom:1px solid #000;margin:0 auto 1mm}
.pg{text-align:right;font-size:7pt;color:#555;margin-top:1mm}
.placeholder{width:210mm;margin:30vh auto;text-align:center;color:var(--mute);font-size:14px}
@media (max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:10px}}
@media print{
 @page{size:A4;margin:0}
 body{display:block;background:#fff}aside,.placeholder{display:none}main{padding:0;overflow:visible}
 .sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page;height:297mm;min-height:0}
 .sheet:last-child{page-break-after:auto;break-after:auto}
 th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<aside>
 <h1>Form Persiapan Barang Kiriman</h1>
 <div id="banner"></div>
 <div><label>Jenis data</label><div class="seg"><label><input type="radio" name="tp" value="FB" checked><span>FB</span></label><label><input type="radio" name="tp" value="Reguler"><span>Reguler</span></label></div></div>
 <div><label for="mon">Bulan</label><select id="mon"></select></div>
 <div><label for="cab">Cabang tujuan</label>
  <input type="text" id="cab" list="cabs" placeholder="Ketik atau pilih cabang" autocomplete="off">
  <datalist id="cabs"></datalist></div>
 <div><div class="row"><label>Nomor DO</label><button class="link" id="all" hidden>Pilih semua</button></div>
  <div class="dos" id="dos"><div class="empty">Pilih cabang untuk menampilkan DO.</div></div></div>
 <div><label for="leader">Leader</label><input type="text" id="leader" placeholder="Contoh: TD"></div>
 <p class="hint" id="src"></p>
 <button id="reload" type="button">Muat ulang data</button>
 <button class="primary" id="print" disabled>Cetak form</button>
</aside>
<main id="out"><div class="placeholder">Preview form muncul di sini setelah DO dipilih.</div></main>
<script>
// URL Web app Google Apps Script (berakhiran /exec). Lihat Code.gs.
const API_URL = 'https://script.google.com/macros/s/AKfycbwPa-6OXQtmhTpoaUJwSyiipHexaccidAurzc2QHsvwPI9dqoF2vQJtGpw1NmdkpUM-/exec';
const API_KEY = '';   // isi hanya jika CONFIG.API_KEY di Code.gs juga diisi
const ROWS_PER_PAGE = 38;
const EMBED = {FB:[],Reguler:[]};
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let all=[],ym=null,type='FB',cabang='',sel=new Set();

function parseDate(s){const m=/^(\d+)\s+(\w{3})\w*\s+(\d{4})/.exec((s||'').trim());return m?{y:+m[3],m:MON[m[2]]}:null}

const mk=d=>d.y+'-'+String(d.m+1).padStart(2,'0');
async function api(p){
 const q=new URLSearchParams(p);if(API_KEY)q.set('key',API_KEY);
 const j=await (await fetch(API_URL+'?'+q)).json();
 if(j.error)throw new Error(j.error);return j;
}
const cache={};
async function getMonths(tp){
 const k='m'+tp;if(cache[k])return cache[k];
 if(API_URL)return cache[k]=(await api({action:'months',type:tp})).months;
 return cache[k]=[...new Set(EMBED[tp].map(r=>{const d=parseDate(r[1]);return d?mk(d):null}).filter(Boolean))].sort().reverse();
}
async function getRows(tp,mo){
 const k=tp+mo;if(cache[k])return cache[k];
 if(API_URL)return cache[k]=(await api({action:'rows',type:tp,month:mo})).rows;
 return cache[k]=EMBED[tp].filter(r=>{const d=parseDate(r[1]);return d&&mk(d)==mo});
}
const msg=(t,err)=>{$('src').textContent=t;$('src').style.color=err?'#b3261e':''};
let req=0;
async function setType(tp){
 type=tp;const my=++req;all=[];ym=null;cabang='';sel.clear();$('cab').value='';$('mon').innerHTML='';refresh();
 if(!API_URL&&!EMBED[tp].length){msg('API_URL belum diisi di file HTML.',1);return}
 msg('Memuat daftar bulan…');
 let ks;try{ks=await getMonths(tp)}catch(e){if(my==req)msg('Gagal terhubung ke Google Spreadsheet: '+e.message,1);return}
 if(my!=req)return;
 const n=new Date(),cur=mk({y:n.getFullYear(),m:n.getMonth()}),pick=ks.includes(cur)?cur:ks[0];
 $('mon').innerHTML=ks.map(k=>{const[y,m]=k.split('-');return `<option value="${k}"${k==pick?' selected':''}>${BLN[m-1]} ${y}${k==cur?' (bulan ini)':''}</option>`}).join('');
 $('banner').innerHTML=ks.length&&!ks.includes(cur)?`<div class="banner">Belum ada data ${BLN[n.getMonth()]} ${n.getFullYear()}. Menampilkan bulan terbaru yang tersedia.</div>`:(ks.length?'':'<div class="banner">Tidak ada data pada tab ini.</div>');
 setMonth();
}
async function setMonth(){
 const v=$('mon').value;cabang='';sel.clear();$('cab').value='';all=[];ym=null;refresh();
 if(!v)return;
 const[y,m]=v.split('-').map(Number),my=++req;msg('Memuat data…');
 try{const rows=await getRows(type,v);if(my!=req)return;all=rows;ym={y,m:m-1}}
 catch(e){if(my==req)msg('Gagal memuat data: '+e.message,1);return}
 msg((API_URL?'Sumber: Google Spreadsheet':'Sumber: data contoh (mode demo)')+` · ${all.length} baris`);
 refresh();
}
function monthRows(){return all}
function refresh(){
 const cs=[...new Set(all.map(r=>r[2]))].sort();
 $('cabs').innerHTML=cs.map(c=>`<option value="${esc(c)}">`).join('');
 renderDOs();
}
function doMap(){const m=new Map();
 monthRows().filter(r=>r[2]===cabang).forEach(r=>{if(!m.has(r[0]))m.set(r[0],[]);m.get(r[0]).push(r)});return m}
function renderDOs(){
 const box=$('dos'),m=cabang?doMap():new Map();
 $('all').hidden=!m.size;
 if(!m.size){box.innerHTML=`<div class="empty">${cabang?'Cabang tidak ditemukan pada bulan ini.':'Pilih cabang untuk menampilkan DO.'}</div>`}
 else box.innerHTML=[...m].sort().map(([k,v])=>`<label class="do"><input type="checkbox" value="${esc(k)}" ${sel.has(k)?'checked':''}><div><b>${esc(k)}</b><span>${esc(v[0][1])} · ${v.length} item</span></div></label>`).join('');
 box.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?sel.add(i.value):sel.delete(i.value);renderForm()});
 renderForm();
}
function renderForm(){
 const m=cabang?doMap():new Map(),dos=[...m.keys()].sort().filter(k=>sel.has(k));
 $('print').disabled=!dos.length;
 if(!dos.length){$('out').innerHTML='<div class="placeholder">Preview form muncul di sini setelah DO dipilih.</div>';return}
 const items=dos.flatMap(k=>m.get(k)),pages=[],CPL=46,wt=r=>Math.max(1,Math.ceil((r[4].length+(r[7]?9:0))/CPL));
 let cur=[],w=0;items.forEach(r=>{const l=wt(r);if(w+l>ROWS_PER_PAGE&&cur.length){pages.push(cur);cur=[];w=0}cur.push(r);w+=l});
 if(cur.length)pages.push(cur);
 let off=0;
 const now=new Date(),tgl=`${now.getDate()}-${now.getMonth()+1}-${now.getFullYear()}`;
 $('out').innerHTML=pages.map((p,pi)=>{
  let tr='',used=0,no=off;
  p.forEach(r=>{used+=wt(r);tr+=`<tr><td class="n">${++no}</td><td class="i">${esc(r[4])}${r[7]?' <small>'+esc(r[7])+'</small>':''}</td><td class="d">${esc(r[0].replace(/^DO-/,''))}</td><td class="q">${esc(r[5])} ${esc(r[6])}</td><td></td><td></td></tr>`});
  for(;used<ROWS_PER_PAGE;used++)tr+=`<tr><td class="n">${++no}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
  off+=p.length;
  return `<section class="sheet"><div class="head"><div><div class="brand">IMPLORA</div><div class="addr">Pergudangan Ritz Park Blok BC-10 dan BC-11 Desa Bohar<br>Kec. Taman, Kab. Sidoarjo 61257 Telp. (031) 8557111</div></div>
  <div class="meta"><div><b>LEADER</b><span>: ${esc($('leader').value)}</span></div><div><b>Nama Cust</b><span>: ${esc(cabang)}</span></div><div><b>TANGGAL</b><span>: ${tgl}</span></div></div></div>
  <h2>FORM PERSIAPAN BARANG KIRIMAN</h2>
  <table><colgroup><col style="width:9mm"><col><col style="width:31mm"><col style="width:22mm"><col style="width:22mm"><col style="width:22mm"></colgroup>
  <thead><tr><th rowspan="2">No</th><th rowspan="2">NAMA ITEM</th><th rowspan="2">NO DO</th><th rowspan="2">JUMLAH</th><th colspan="2">PARAF</th></tr><tr><th>LEADER</th><th>CHECKER WAREHOUSE</th></tr></thead><tbody>${tr}</tbody></table>
  <div class="foot"><div class="pallet">PALLET KE :</div><div class="sign"><div><i></i>Diperiksa Oleh :</div><div><i></i>Diketahui Oleh :</div></div></div>
  <div class="pg">Halaman ${pi+1} / ${pages.length}</div></section>`}).join('');
}
$('cab').addEventListener('input',e=>{const v=e.target.value.trim().toUpperCase();
 const hit=[...$('cabs').options].map(o=>o.value).find(c=>c.toUpperCase()===v);
 const nc=hit||'';if(nc!==cabang){cabang=nc;sel.clear();renderDOs()}});
$('all').onclick=()=>{const m=doMap();const every=[...m.keys()].every(k=>sel.has(k));m.forEach((_,k)=>every?sel.delete(k):sel.add(k));renderDOs()};
$('leader').addEventListener('input',renderForm);
$('print').onclick=()=>window.print();
document.querySelectorAll('input[name=tp]').forEach(i=>i.onchange=()=>setType(i.value));
$('mon').onchange=setMonth;
$('reload').onclick=()=>{Object.keys(cache).forEach(k=>delete cache[k]);setType(type)};
setType('FB');
</script></body></html>
